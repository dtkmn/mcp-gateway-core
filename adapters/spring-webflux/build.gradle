tasks.withType(GenerateModuleMetadata).configureEach {
    enabled = false
}

def springWebFluxPublicationArtifact = { File publicationDir, String extension, String classifier = null ->
    String resolvedVersion = springWebFluxPublicationVersion
    if (springWebFluxPublicationVersion.endsWith('-SNAPSHOT')) {
        File metadataFile = new File(publicationDir, 'maven-metadata.xml')
        if (!metadataFile.isFile()) {
            throw new GradleException("Missing adapter snapshot metadata: ${metadataFile}")
        }
        def metadata = new groovy.xml.XmlSlurper(false, false).parse(metadataFile)
        def matches = metadata.versioning.snapshotVersions.snapshotVersion.findAll { snapshotVersion ->
            String metadataClassifier = snapshotVersion.classifier.text()
            snapshotVersion.extension.text() == extension
                    && (classifier == null ? metadataClassifier.isEmpty() : metadataClassifier == classifier)
        }
        if (matches.size() != 1) {
            throw new GradleException(
                    "Expected one ${classifier == null ? 'main' : classifier} ${extension} entry in ${metadataFile}, got ${matches.size()}"
            )
        }
        resolvedVersion = matches[0].value.text()
        if (resolvedVersion.isBlank()) {
            throw new GradleException("Snapshot metadata entry has no resolved version in ${metadataFile}")
        }
    }

    String classifierSuffix = classifier == null ? '' : "-${classifier}"
    new File(publicationDir, "${springWebFluxArtifactId}-${resolvedVersion}${classifierSuffix}.${extension}")
}

tasks.register('verifyGatewaySpringWebFluxPublication') {
    group = 'verification'
    description = 'Verifies the local Maven publication shape for the Spring WebFlux adapter.'
    dependsOn tasks.named('publishGatewaySpringWebFluxPublicationToGatewayCoreStagingRepository')

    doLast {
        File publicationDir = springWebFluxPublicationDirectory()
        List<File> publicationArtifacts = [
                springWebFluxPublicationArtifact(publicationDir, 'pom'),
                springWebFluxPublicationArtifact(publicationDir, 'jar'),
                springWebFluxPublicationArtifact(publicationDir, 'jar', 'sources'),
                springWebFluxPublicationArtifact(publicationDir, 'jar', 'javadoc')
        ]
        publicationArtifacts.each { artifact ->
            if (!artifact.isFile()) {
                throw new GradleException("Missing adapter publication artifact: ${artifact}")
            }
            verifyChecksumFile(artifact, 'MD5', 'md5')
            verifyChecksumFile(artifact, 'SHA-1', 'sha1')
            verifyChecksumFile(artifact, 'SHA-256', 'sha256')
            verifyChecksumFile(artifact, 'SHA-512', 'sha512')
        }
    }
}

tasks.register('stageGatewaySpringWebFluxCentralPortalBundle', Zip) {
    group = 'publishing'
    description = 'Stages a Central Portal upload bundle for mcp-gateway-spring-webflux without signatures.'
    dependsOn tasks.named('publishGatewaySpringWebFluxPublicationToGatewayCoreStagingRepository')
    from(springWebFluxPublicationDirectory()) {
        into publicationPath
    }
    archiveFileName = springWebFluxCentralBundleName
    destinationDirectory = layout.buildDirectory.dir('central-portal-bundle')
}

tasks.register('verifyGatewaySpringWebFluxCentralPortalBundle') {
    group = 'verification'
    description = 'Verifies the unsigned Central Portal bundle shape and checksums for the Spring WebFlux adapter.'
    dependsOn tasks.named('stageGatewaySpringWebFluxCentralPortalBundle')

    doLast {
        File bundle = tasks.named('stageGatewaySpringWebFluxCentralPortalBundle').get().archiveFile.get().asFile
        verifyCentralPortalBundleShape(springWebFluxPublicationDirectory(), bundle)
        verifyCentralPortalBundlePayload(bundle)
        println 'Spring WebFlux Central Portal bundle shape verified without .asc signatures.'
    }
}

tasks.register('verifyGatewaySpringWebFluxPublicPreviewPublication') {
    group = 'verification'
    description = 'Runs public-preview checks for the Spring WebFlux adapter artifact.'
    dependsOn tasks.named('build')
    dependsOn tasks.named('verifyNoForbiddenSpringWebFluxAdapterCoupling')
    dependsOn tasks.named('verifySpringWebFluxJarClosedWorld')
    dependsOn tasks.named('verifySpringWebFluxJavaReleaseBytecode')
    dependsOn tasks.named('verifySpringWebFluxRuntimeClasspathJavaReleaseBytecode')
    dependsOn tasks.named('verifyGatewaySpringWebFluxPublication')
    dependsOn tasks.named('verifyGatewaySpringWebFluxCentralPortalBundle')
}

