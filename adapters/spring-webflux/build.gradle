plugins {
    id 'java-library'
    id 'maven-publish'
}

group = providers.gradleProperty('gatewayCoreGroup')
        .orElse('io.github.dtkmn')
        .get()
version = providers.gradleProperty('gatewayCoreVersion')
        .orElse('0.7.0')
        .get()

def springWebFluxArtifactId = 'mcp-gateway-spring-webflux'
def springFrameworkVersion = providers.gradleProperty('springFrameworkVersion').orElse('7.0.8').get()
def springSecurityVersion = providers.gradleProperty('springSecurityVersion').orElse('7.1.0').get()
def jacksonDatabindVersion = providers.gradleProperty('jacksonDatabindVersion').orElse('3.1.5').get()
def reactorVersion = providers.gradleProperty('reactorVersion').orElse('3.8.6').get()
def springBootVersion = providers.gradleProperty('springBootVersion').orElse('4.1.0').get()
def springAiVersion = providers.gradleProperty('springAiVersion').orElse('2.0.0').get()
def mcpJavaSdkVersion = providers.gradleProperty('mcpJavaSdkVersion').orElse('2.0.0').get()
def nettyVersion = providers.gradleProperty('nettyVersion').orElse('4.2.16.Final').get()
def logbackVersion = providers.gradleProperty('logbackVersion').orElse('1.5.36').get()
def log4jVersion = providers.gradleProperty('log4jVersion').orElse('2.25.5').get()
def gatewayJavaRelease = 17
def gatewayJavaClassFileMajorVersion = 61

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
    withSourcesJar()
    withJavadocJar()
}

tasks.withType(JavaCompile).configureEach {
    options.release = gatewayJavaRelease
}

tasks.withType(Jar).configureEach {
    archiveBaseName = springWebFluxArtifactId
    from(rootProject.file('LICENSE')) {
        into 'META-INF'
    }
}

repositories {
    mavenCentral()
}

dependencies {
    api project(':core')
    api "org.springframework:spring-webflux:${springFrameworkVersion}"
    api "org.springframework.security:spring-security-core:${springSecurityVersion}"
    api "tools.jackson.core:jackson-databind:${jacksonDatabindVersion}"

    testImplementation platform('org.junit:junit-bom:6.1.2')
    testImplementation platform("org.springframework.boot:spring-boot-dependencies:${springBootVersion}")
    testImplementation platform("org.springframework.ai:spring-ai-bom:${springAiVersion}")
    testImplementation platform("io.modelcontextprotocol.sdk:mcp-bom:${mcpJavaSdkVersion}")
    testImplementation platform("io.netty:netty-bom:${nettyVersion}")
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testImplementation 'org.springframework.boot:spring-boot-starter-webflux'
    testImplementation "ch.qos.logback:logback-classic:${logbackVersion}"
    testImplementation "org.apache.logging.log4j:log4j-to-slf4j:${log4jVersion}"
    testImplementation 'org.springframework.ai:mcp-spring-webflux'
    testImplementation 'io.modelcontextprotocol.sdk:mcp-core'
    testImplementation 'io.modelcontextprotocol.sdk:mcp-json-jackson3'
    testImplementation "org.springframework:spring-test:${springFrameworkVersion}"
    testImplementation "io.projectreactor:reactor-test:${reactorVersion}"
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.register('verifySpringWebFluxJarClosedWorld') {
    group = 'verification'
    description = 'Verifies the adapter JAR contains classes only under mcp/gateway/spring/webflux, allowing resources.'
    dependsOn tasks.named('jar')

    doLast {
        File jarFile = tasks.named('jar').get().archiveFile.get().asFile
        List<String> classes = []
        List<String> unexpected = []
        new java.util.zip.ZipFile(jarFile).withCloseable { jar ->
            jar.entries().each { entry ->
                String name = entry.name
                if (entry.isDirectory() || !name.endsWith('.class')) {
                    return
                }
                if (name.startsWith('mcp/gateway/spring/webflux/')) {
                    classes.add(name)
                } else {
                    unexpected.add(name)
                }
            }
        }
        if (classes.isEmpty()) {
            throw new GradleException('Spring WebFlux adapter JAR must contain classes under mcp/gateway/spring/webflux/.')
        }
        if (!unexpected.isEmpty()) {
            throw new GradleException("Spring WebFlux adapter JAR contains unexpected classes: ${unexpected.sort().take(20)}")
        }
    }
}

def verifyClassFileIsJavaReleaseCompatible = { String owner, String className, InputStream input, List<String> mismatches ->
    byte[] header = input.readNBytes(8)
    if (header.length < 8) {
        mismatches.add("${owner}!${className}: truncated class header")
        return
    }
    int major = ((header[6] & 0xff) << 8) | (header[7] & 0xff)
    if (major > gatewayJavaClassFileMajorVersion) {
        mismatches.add("${owner}!${className}: class-file major ${major}, maximum ${gatewayJavaClassFileMajorVersion} for Java ${gatewayJavaRelease}")
    }
}

def multiReleaseVersion = { String entryName ->
    if (!entryName.startsWith('META-INF/versions/')) {
        return null
    }
    String[] parts = entryName.split('/')
    if (parts.length < 4) {
        return null
    }
    try {
        return Integer.parseInt(parts[2])
    } catch (NumberFormatException ignored) {
        return null
    }
}

tasks.register('verifySpringWebFluxRuntimeClasspathJavaReleaseBytecode') {
    group = 'verification'
    description = 'Verifies adapter runtime dependencies are compatible with Java 17.'
    dependsOn tasks.named('jar')

    inputs.files(configurations.runtimeClasspath)

    doLast {
        List<String> mismatches = []
        int classCount = 0
        configurations.runtimeClasspath.files.sort().each { file ->
            if (file.isDirectory()) {
                file.eachFileRecurse { candidate ->
                    if (!candidate.isFile() || !candidate.name.endsWith('.class')) {
                        return
                    }
                    classCount++
                    candidate.withInputStream { input ->
                        verifyClassFileIsJavaReleaseCompatible(file.name, file.toPath().relativize(candidate.toPath()).toString(), input, mismatches)
                    }
                }
            } else if (file.name.endsWith('.jar')) {
                new java.util.zip.ZipFile(file).withCloseable { jar ->
                    jar.entries().each { entry ->
                        if (!entry.name.endsWith('.class')) {
                            return
                        }
                        Integer version = multiReleaseVersion(entry.name)
                        if (version != null && version > gatewayJavaRelease) {
                            return
                        }
                        classCount++
                        jar.getInputStream(entry).withCloseable { input ->
                            verifyClassFileIsJavaReleaseCompatible(file.name, entry.name, input, mismatches)
                        }
                    }
                }
            }
        }
        if (classCount == 0) {
            throw new GradleException('Spring WebFlux adapter runtime classpath must contain class files to verify.')
        }
        if (!mismatches.isEmpty()) {
            throw new GradleException("Spring WebFlux adapter runtime classpath is not Java ${gatewayJavaRelease} compatible:\n${mismatches.take(20).join('\n')}")
        }
    }
}

publishing {
    publications {
        gatewaySpringWebFlux(MavenPublication) {
            from components.java
            artifactId = springWebFluxArtifactId
            pom {
                name = 'MCP Gateway Spring WebFlux Adapter'
                description = 'Spring WebFlux adapter for applying MCP Gateway Core governance contracts to MCP HTTP traffic.'
                url = 'https://github.com/dtkmn/mcp-gateway-core'
                licenses {
                    license {
                        name = 'Apache License, Version 2.0'
                        url = 'https://www.apache.org/licenses/LICENSE-2.0'
                    }
                }
                developers {
                    developer {
                        id = 'dtkmn'
                        name = 'Daniel Tse'
                    }
                }
                scm {
                    connection = 'scm:git:https://github.com/dtkmn/mcp-gateway-core.git'
                    developerConnection = 'scm:git:ssh://git@github.com/dtkmn/mcp-gateway-core.git'
                    url = 'https://github.com/dtkmn/mcp-gateway-core'
                }
            }
        }
    }
    repositories {
        maven {
            name = 'gatewayCoreStaging'
            url = providers.gradleProperty('gatewayCorePublicationRepositoryUrl')
                    .map { uri(it) }
                    .orElse(rootProject.layout.buildDirectory.dir('staging-repository').map { it.asFile.toURI() })
                    .get()
        }
    }
}

tasks.withType(GenerateModuleMetadata).configureEach {
    enabled = false
}

tasks.named('test') {
    useJUnitPlatform()
}

tasks.named('check') {
    dependsOn tasks.named('verifySpringWebFluxJarClosedWorld')
    dependsOn tasks.named('verifySpringWebFluxRuntimeClasspathJavaReleaseBytecode')
}
