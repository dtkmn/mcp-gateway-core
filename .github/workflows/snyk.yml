name: Snyk

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]
  schedule:
    - cron: "37 18 * * 2"
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  statuses: write

jobs:
  gradle-open-source:
    name: Gradle Open Source scan
    # Fork pull requests cannot access the Snyk token; CI and CodeQL still run.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Mark Snyk vulnerability check pending
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state=pending \
            -f context="Snyk vulnerabilities" \
            -f description="Dependency scan is running" \
            -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            --silent

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6

      - name: Set up JDK 25
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: "25"
          cache: gradle

      - name: Require Snyk configuration
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
          SNYK_ORG: ${{ secrets.SNYK_ORG || vars.SNYK_ORG }}
        run: |
          set -euo pipefail
          if [ -z "${SNYK_TOKEN}" ]; then
            echo "::error::Missing SNYK_TOKEN repository or organization secret. Configure Snyk before treating this workflow as a passing external scan."
            exit 1
          fi
          if [ -z "${SNYK_ORG}" ]; then
            echo "::notice::SNYK_ORG secret or variable is not set; Snyk will use the default organization associated with SNYK_TOKEN."
          fi

      - name: Install Snyk CLI
        uses: snyk/actions/setup@9adf32b1121593767fc3c057af55b55db032dc04 # v1.0.0

      - name: Run Snyk Open Source scan
        id: snyk
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
          SNYK_ORG: ${{ secrets.SNYK_ORG || vars.SNYK_ORG }}
        run: |
          set -euo pipefail
          snyk_args=(--all-sub-projects --policy-path=.snyk --sarif-file-output=snyk-open-source.sarif)
          if [ -n "${SNYK_ORG}" ]; then
            snyk_args+=("--org=${SNYK_ORG}")
          fi
          status=0
          snyk test "${snyk_args[@]}" || status=$?
          echo "exit_code=${status}" >> "${GITHUB_OUTPUT}"
          case "${status}" in
            0) ;;
            1) echo "::warning::Snyk found vulnerable dependencies. See the Snyk vulnerabilities check and Code scanning alerts." ;;
            *)
              echo "::error::Snyk could not complete the scan (exit code ${status})."
              exit "${status}"
              ;;
          esac

      - name: Upload Snyk SARIF to GitHub Code Scanning
        uses: github/codeql-action/upload-sarif@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4
        with:
          sarif_file: snyk-open-source.sarif
          category: snyk-open-source

      - name: Upload Snyk SARIF artifact
        if: always() && hashFiles('snyk-open-source.sarif') != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: snyk-open-source-sarif
          if-no-files-found: error
          retention-days: 14
          path: snyk-open-source.sarif

      # Keep finding severity separate from the scan workflow's operational health.
      - name: Publish Snyk vulnerability check
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          SCAN_JOB_STATUS: ${{ job.status }}
          SNYK_EXIT_CODE: ${{ steps.snyk.outputs.exit_code }}
        run: |
          set -euo pipefail
          state=error
          description="Snyk scan or report upload failed; check the workflow logs"
          if [ "${SCAN_JOB_STATUS}" = "success" ]; then
            case "${SNYK_EXIT_CODE}" in
              0)
                state=success
                description="No vulnerable dependencies found"
                ;;
              1)
                state=failure
                description="Vulnerable dependencies found; see Code scanning alerts"
                ;;
            esac
          fi
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state="${state}" \
            -f context="Snyk vulnerabilities" \
            -f description="${description}" \
            -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            --silent
